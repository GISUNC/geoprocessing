<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial Operations Catalog</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0}
    .container{max-width:1000px;margin:24px auto;padding:0 16px}
    .card{background:white;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .search{width:100%;padding:10px;border:1px solid #ccd;border-radius:8px;margin:12px 0 18px}
    h1,h2{margin:0 0 10px}
    .category{margin:20px 0 10px;color:#334}
    .muted{color:#667}
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Spatial Operations Catalog</h1>
      <p class="muted">This copy uses neutral labels and avoids explicit method names.</p>
      <label for="searchInput">Search by label</label>
      <input id="searchInput" class="search" type="search" placeholder="e.g. op-01" />
    </section>
    <div id="catalog"></div>
  </main>

  <script src="items.js"></script>
  <script>
    const catalog = document.getElementById('catalog');
    const searchInput = document.getElementById('searchInput');

    function render(filter = '') {
      const normalized = filter.trim().toLowerCase();
      const filtered = window.ITEMS.filter(item =>
        item.title.toLowerCase().includes(normalized) ||
        item.category.toLowerCase().includes(normalized) ||
        item.id.toLowerCase().includes(normalized)
      );

      const byCategory = filtered.reduce((acc, item) => {
        (acc[item.category] ??= []).push(item);
        return acc;
      }, {});

      catalog.innerHTML = '';
      if (!filtered.length) {
        catalog.innerHTML = '<p class="muted">No items found for this filter.</p>';
        return;
      }

      Object.entries(byCategory).forEach(([category, items]) => {
        const title = document.createElement('h2');
        title.className = 'category';
        title.textContent = category;
        catalog.appendChild(title);

        const grid = document.createElement('section');
        grid.className = 'grid';

        items.forEach(item => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <h3>${item.title}</h3>
            <p>ID: <code>${item.id}</code></p>
            <p class="muted">Source file: <code>${item.file}</code></p>
          `;
          grid.appendChild(card);
        });

        catalog.appendChild(grid);
      });
    }

    searchInput.addEventListener('input', () => render(searchInput.value));
    render();
  </script>
</body>
</html>
