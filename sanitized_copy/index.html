<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial Challenge Set</title>
</head>
<body>
  <main class="container">
    <section class="header-card">
      <h1>Spatial Challenge Set</h1>
      <div class="actions">
        <a class="btn primary" href="presentation.html">Open Challenge Mode</a>
      </div>
      <label class="search-wrap" for="searchInput">
        Search by operation code
        <input id="searchInput" type="search" placeholder="e.g. op-07" />
      </label>
    </section>

    <div id="catalog"></div>
  </main>

  <script src="catalog.js"></script>
  <script>
    const catalog = document.getElementById('catalog');
    const searchInput = document.getElementById('searchInput');

    function render(filter = '') {
      const normalized = filter.trim().toLowerCase();
      const filtered = window.CATALOG.filter(item =>
        item.title.toLowerCase().includes(normalized) ||
        item.category.toLowerCase().includes(normalized) ||
        item.id.toLowerCase().includes(normalized)
      );

      const byCategory = filtered.reduce((acc, item) => {
        (acc[item.category] ??= []).push(item);
        return acc;
      }, {});

      catalog.innerHTML = '';
      if (!filtered.length) {
        catalog.innerHTML = '<p class="empty">No operations found for this filter.</p>';
        return;
      }

      Object.entries(byCategory).forEach(([category, items]) => {
        const title = document.createElement('h2');
        title.className = 'category';
        title.textContent = category;
        catalog.appendChild(title);

        const grid = document.createElement('section');
        grid.className = 'grid';

        items.forEach(item => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <h3>${item.title}</h3>
            <p>ID: <code>${item.id}</code></p>
            <div class="row-actions">
              <a class="btn open" href="${item.file}">Open challenge</a>
              <a class="btn" href="presentation.html#${item.id}">Present from here</a>
            </div>
          `;
          grid.appendChild(card);
        });

        catalog.appendChild(grid);
      });
    }

    searchInput.addEventListener('input', () => render(searchInput.value));
    render();
  </script>
</body>
</html>
