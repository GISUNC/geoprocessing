<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ring - Line</title>

<style>
  body { font-family: Arial, sans-serif; margin: 40px; }
  h1 { margin-bottom: 5px; }
  .description { margin-bottom: 25px; max-width: 650px; }
  .container { display: flex; gap: 40px; margin-bottom: 20px; }
  .box { width: 420px; height: 300px; border: 1px solid #ccc; }
  .legend { margin-top: 10px; }
  .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
  .legend svg { margin-right: 10px; }
</style>
</head>

<body>

<h1>ring</h1>

<div class="description">
ring creates a polygon that represents a distance from a point,
line or the boundary of a polygon.
</div>

<div class="container">

  <!-- DIV 1: Original Curved Line -->
  <div class="box">
    <svg width="420" height="300" viewBox="0 0 420 300">
      <!-- Curved line (cubic Bézier) -->
      <path
        d="M 40 230
           C 120 70, 220 280, 380 80"
        fill="none"
        stroke="blue"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <!-- DIV 2: Curved Line + ring -->
  <div class="box">
    <svg width="420" height="300" viewBox="0 0 420 300">
      <!--
        ring “polygon” (static SVG approximation):
        A true Turf ring returns a polygon. In SVG, the most faithful *visual*
        equivalent (in screen space) is a thick stroked path with rounded joins/caps.
      -->
      <path
        d="M 40 230
           C 120 70, 220 280, 380 80"
        fill="none"
        stroke="red"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.20"
      />

      <!-- Optional crisp ring outline -->
      <path
        d="M 40 230
           C 120 70, 220 280, 380 80"
        fill="none"
        stroke="red"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.35"
      />

      <!-- Original line on top -->
      <path
        d="M 40 230
           C 120 70, 220 280, 380 80"
        fill="none"
        stroke="blue"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

</div>

<div class="legend">
  <div class="legend-item">
    <svg width="20" height="20">
      <line x1="2" y1="16" x2="18" y2="4" stroke="blue" stroke-width="4" stroke-linecap="round"/>
    </svg>
    = original line data
  </div>

  <div class="legend-item">
    <svg width="20" height="20">
      <path d="M2 14 C7 6, 12 18, 18 6"
            fill="none" stroke="red" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
    </svg>
    = new polygon layer
  </div>
</div>

</body>
</html>
