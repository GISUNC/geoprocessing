<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intersection - Points with Polygon</title>

<style>
  body { font-family: Arial, sans-serif; margin: 40px; color: #111; }
  h1 { margin: 0 0 6px 0; }
  .description { margin: 0 0 22px 0; max-width: 900px; }

  .container { display: flex; gap: 40px; flex-wrap: wrap; }
  .panel { width: 420px; }
  .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }

  .box { width: 420px; height: 300px; border: 1px solid #ccc; }

  table { border-collapse: collapse; width: 420px; margin: 10px 0 18px 0; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
  th { background: #f6f6f6; }

  .blue  { background-color: rgba(0,0,255,0.15); }
  .green { background-color: rgba(0,128,0,0.15); }
  .red   { background-color: rgba(255,0,0,0.20); }

  .pt-label {
    font-size: 12px;
    font-weight: bold;
    fill: #111;
  }
</style>
</head>

<body>

<h1>Intersection</h1>
<div class="description">
Intersection keeps only the features that fall inside another feature and writes those to a new output layer.
</div>

<div class="container">

  <div class="panel">
    <div class="panel-title">Original Data</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">

        <rect x="110" y="70" width="220" height="170"
              fill="green" fill-opacity="0.20"
              stroke="green" stroke-width="3" />

        <!-- Outside -->
        <circle cx="70"  cy="110" r="6" fill="blue"/>
        <text x="70" y="100" text-anchor="middle" class="pt-label">1</text>

        <circle cx="360" cy="90"  r="6" fill="blue"/>
        <text x="360" y="80" text-anchor="middle" class="pt-label">2</text>

        <circle cx="90"  cy="250" r="6" fill="blue"/>
        <text x="90" y="240" text-anchor="middle" class="pt-label">3</text>

        <!-- Inside -->
        <circle cx="160" cy="120" r="6" fill="blue"/>
        <text x="160" y="110" text-anchor="middle" class="pt-label">4</text>

        <circle cx="220" cy="170" r="6" fill="blue"/>
        <text x="220" y="160" text-anchor="middle" class="pt-label">5</text>

        <circle cx="300" cy="210" r="6" fill="blue"/>
        <text x="300" y="200" text-anchor="middle" class="pt-label">6</text>

        <circle cx="140" cy="220" r="6" fill="blue"/>
        <text x="140" y="210" text-anchor="middle" class="pt-label">7</text>

      </svg>
    </div>

    <table>
      <thead><tr class="blue"><th>Point layer (id)</th></tr></thead>
      <tbody>
        <tr class="blue"><td>1</td></tr>
        <tr class="blue"><td>2</td></tr>
        <tr class="blue"><td>3</td></tr>
        <tr class="blue"><td>4</td></tr>
        <tr class="blue"><td>5</td></tr>
        <tr class="blue"><td>6</td></tr>
        <tr class="blue"><td>7</td></tr>
      </tbody>
    </table>

    <table>
      <thead><tr class="green"><th>Polygon layer (id)</th></tr></thead>
      <tbody><tr class="green"><td>10</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <div class="panel-title">Intersection Result</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">

        <rect x="110" y="70" width="220" height="170"
              fill="green" fill-opacity="0.10"
              stroke="green" stroke-width="2" />

        <!-- Intersected points -->
        <circle cx="160" cy="120" r="7" fill="red"/>
        <text x="160" y="108" text-anchor="middle" class="pt-label">4</text>

        <circle cx="220" cy="170" r="7" fill="red"/>
        <text x="220" y="158" text-anchor="middle" class="pt-label">5</text>

        <circle cx="300" cy="210" r="7" fill="red"/>
        <text x="300" y="198" text-anchor="middle" class="pt-label">6</text>

        <circle cx="140" cy="220" r="7" fill="red"/>
        <text x="140" y="208" text-anchor="middle" class="pt-label">7</text>

      </svg>
    </div>

    <table>
      <thead><tr class="red"><th>point_id</th><th>polygon_id</th></tr></thead>
      <tbody>
        <tr class="red"><td>4</td><td>10</td></tr>
        <tr class="red"><td>5</td><td>10</td></tr>
        <tr class="red"><td>6</td><td>10</td></tr>
        <tr class="red"><td>7</td><td>10</td></tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
