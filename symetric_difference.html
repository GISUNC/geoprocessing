<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Symmetric Difference</title>

<style>
  body { font-family: Arial, sans-serif; margin: 40px; color: #111; }
  h1 { margin: 0 0 6px 0; }
  .description { margin: 0 0 22px 0; max-width: 980px; }

  .container { display: flex; gap: 40px; flex-wrap: wrap; }
  .panel { width: 420px; }
  .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }

  .box { width: 420px; height: 300px; border: 1px solid #ccc; }

  table { border-collapse: collapse; width: 420px; margin: 10px 0 18px 0; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
  th { background: #f6f6f6; }

  .blue  { background-color: rgba(0,0,255,0.15); }
  .green { background-color: rgba(0,128,0,0.15); }

  .darkred  { background-color: rgba(139,0,0,0.25); }
  .lightred { background-color: rgba(255,127,127,0.25); }

  .piece-label { font-size: 12px; font-weight: bold; fill: #111; }
</style>
</head>

<body>

<h1>Symmetric Difference</h1>

<div class="description">
Symmetric Difference keeps only the portions of the input layers that do not overlap.
The shared (overlapping) area between the layers is removed from the output.
</div>

<div class="container">

  <!-- ORIGINAL DATA -->
  <div class="panel">
    <div class="panel-title">Original Data</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">

        <!-- Layer 1 -->
        <rect x="80" y="80" width="180" height="140"
              fill="blue" fill-opacity="0.20"
              stroke="blue" stroke-width="3" />

        <!-- Layer 2 -->
        <rect x="170" y="140" width="180" height="120"
              fill="green" fill-opacity="0.20"
              stroke="green" stroke-width="3" />

      </svg>
    </div>

    <table>
      <thead><tr class="blue"><th>Layer 1 (id)</th></tr></thead>
      <tbody><tr class="blue"><td>1</td></tr></tbody>
    </table>

    <table>
      <thead><tr class="green"><th>Layer 2 (id)</th></tr></thead>
      <tbody><tr class="green"><td>2</td></tr></tbody>
    </table>
  </div>

  <!-- SYMMETRIC DIFFERENCE RESULT -->
  <div class="panel">
    <div class="panel-title">Symmetric Difference Result</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">

        <!-- faint originals -->
        <rect x="80" y="80" width="180" height="140"
              fill="none" stroke="blue" stroke-width="2" opacity="0.30"/>
        <rect x="170" y="140" width="180" height="120"
              fill="none" stroke="green" stroke-width="2" opacity="0.30"/>

        <!-- Layer 1 only (dark red) -->
        <polygon
          points="80,80 260,80 260,140 170,140 170,220 80,220"
          fill="#8b0000" fill-opacity="0.6"
          stroke="#8b0000" stroke-width="3"
        />

        <!-- Layer 2 only (light red) -->
        <polygon
          points="170,220 170,260 350,260 350,140 260,140 260,220"
          fill="#ff7f7f" fill-opacity="0.7"
          stroke="#ff7f7f" stroke-width="3"
        />

      </svg>
    </div>

    <table>
      <thead>
        <tr>
          <th>out_id</th>
          <th>layer1_id</th>
          <th>layer2_id</th>
        </tr>
      </thead>
      <tbody>
        <tr class="darkred"><td>1</td><td>1</td><td>NULL</td></tr>
        <tr class="lightred"><td>2</td><td>NULL</td><td>2</td></tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
