<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convex Hull - Points</title>

<style>
  body { font-family: Arial, sans-serif; margin: 40px; color: #111; }
  h1 { margin: 0 0 6px 0; }
  .description { margin: 0 0 22px 0; max-width: 820px; }

  .container { display: flex; gap: 40px; margin: 18px 0; flex-wrap: wrap; }
  .panel { width: 420px; }
  .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }

  .box { width: 420px; height: 300px; border: 1px solid #ccc; }

  .legend { margin-top: 10px; }
  .legend-item { display: flex; align-items: center; margin-bottom: 6px; }
  .legend svg { margin-right: 10px; }
</style>
</head>

<body>

<h1>Convex Hull</h1>

<div class="description">
A convex hull makes a layer that shows the perimeter of a group of points.
</div>

<div class="container">

  <!-- LEFT: Original points -->
  <div class="panel">
    <div class="panel-title">Original Points</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">
        <!-- Points (blue) -->
        <circle cx="70"  cy="210" r="6" fill="blue"/>
        <circle cx="110" cy="90"  r="6" fill="blue"/>
        <circle cx="160" cy="160" r="6" fill="blue"/>
        <circle cx="230" cy="70"  r="6" fill="blue"/>
        <circle cx="260" cy="170" r="6" fill="blue"/>
        <circle cx="330" cy="110" r="6" fill="blue"/>
        <circle cx="350" cy="230" r="6" fill="blue"/>
        <circle cx="210" cy="230" r="6" fill="blue"/>
        <circle cx="120" cy="230" r="6" fill="blue"/>
      </svg>
    </div>
  </div>

  <!-- RIGHT: Points + convex hull -->
  <div class="panel">
    <div class="panel-title">Convex Hull</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300">

        <!-- Convex hull polygon (red) - updated so it contains ALL points -->
        <!-- Hull vertices (in order): (70,210) (110,90) (230,70) (330,110) (350,230) (120,230) -->
        <polygon
          points="70,210 110,90 230,70 330,110 350,230 120,230"
          fill="red"
          fill-opacity="0.2"
          stroke="red"
          stroke-width="3"
        />

        <!-- Optional “rubber band” outline (same hull, slightly stronger stroke) -->
        <polyline
          points="70,210 110,90 230,70 330,110 350,230 120,230 70,210"
          fill="none"
          stroke="red"
          stroke-width="2"
          stroke-dasharray="6 6"
          opacity="0.7"
        />

        <!-- Points (blue) -->
        <circle cx="70"  cy="210" r="6" fill="blue"/>
        <circle cx="110" cy="90"  r="6" fill="blue"/>
        <circle cx="160" cy="160" r="6" fill="blue"/>
        <circle cx="230" cy="70"  r="6" fill="blue"/>
        <circle cx="260" cy="170" r="6" fill="blue"/>
        <circle cx="330" cy="110" r="6" fill="blue"/>
        <circle cx="350" cy="230" r="6" fill="blue"/>
        <circle cx="210" cy="230" r="6" fill="blue"/>
        <circle cx="120" cy="230" r="6" fill="blue"/>

      </svg>
    </div>

    <div class="legend">
      <div class="legend-item">
        <svg width="20" height="20">
          <circle cx="10" cy="10" r="5" fill="blue"/>
        </svg>
        = points
      </div>

      <div class="legend-item">
        <svg width="20" height="20">
          <rect x="3" y="3" width="14" height="14" fill="red" fill-opacity="0.2" stroke="red" stroke-width="2"/>
        </svg>
        = convex hull polygon
      </div>
    </div>

  </div>

</div>

</body>
</html>
