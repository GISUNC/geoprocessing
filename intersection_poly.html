<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Intersection</title>

<style>
  body { font-family: Arial, sans-serif; margin: 40px; color: #111; }
  h1 { margin: 0 0 6px 0; }
  .description { margin: 0 0 22px 0; max-width: 900px; }

  .container { display: flex; gap: 40px; margin: 18px 0; flex-wrap: wrap; }
  .panel { width: 420px; }
  .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 6px; }

  .box { width: 420px; height: 300px; border: 1px solid #ccc; }

  table { border-collapse: collapse; width: 420px; margin: 10px 0 20px 0; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
  th { background: #f6f6f6; }

  .layer-table-title { font-weight: 700; margin: 10px 0 6px 0; }
  .blue { background-color: rgba(0,0,255,0.15); }
  .green { background-color: rgba(0,128,0,0.15); }
  .red { background-color: rgba(255,0,0,0.20); }
</style>
</head>

<body>

<h1>Intersection</h1>

<div class="description">
Intersection computes the shared geometry between input layers and writes a new feature containing attributes from all overlapping inputs.
</div>

<div class="container">

  <!-- LEFT: Original layers (map + separate tables) -->
  <div class="panel">
    <div class="panel-title">Original Data</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300" aria-label="Original polygons">

        <!-- Layer 1 -->
        <rect x="80" y="80" width="180" height="140"
              fill="blue" fill-opacity="0.20"
              stroke="blue" stroke-width="3" />

        <!-- Layer 2 -->
        <rect x="170" y="140" width="180" height="120"
              fill="green" fill-opacity="0.20"
              stroke="green" stroke-width="3" />

      </svg>
    </div>

    <div class="layer-table-title">Layer 1 (blue)</div>
    <table aria-label="Layer 1 table">
      <thead>
        <tr class="blue">
          <th>id</th>
        </tr>
      </thead>
      <tbody>
        <tr class="blue"><td>1</td></tr>
      </tbody>
    </table>

    <div class="layer-table-title">Layer 2 (green)</div>
    <table aria-label="Layer 2 table">
      <thead>
        <tr class="green">
          <th>id</th>
        </tr>
      </thead>
      <tbody>
        <tr class="green"><td>2</td></tr>
      </tbody>
    </table>
  </div>

  <!-- RIGHT: Intersection result -->
  <div class="panel">
    <div class="panel-title">Intersection Result</div>

    <div class="box">
      <svg width="420" height="300" viewBox="0 0 420 300" aria-label="Intersection result">

        <!-- Originals lightly for context -->
        <rect x="80" y="80" width="180" height="140"
              fill="blue" fill-opacity="0.10"
              stroke="blue" stroke-width="2" />

        <rect x="170" y="140" width="180" height="120"
              fill="green" fill-opacity="0.10"
              stroke="green" stroke-width="2" />

        <!-- TRUE intersection -->
        <rect x="170" y="140" width="90" height="80"
              fill="red" fill-opacity="0.30"
              stroke="red" stroke-width="3" />

      </svg>
    </div>

    <table aria-label="Intersection output table">
      <thead>
        <tr class="red">
          <th>layer1_id</th>
          <th>layer2_id</th>
        </tr>
      </thead>
      <tbody>
        <tr class="red">
          <td>1</td>
          <td>2</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
