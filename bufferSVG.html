<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Buffer</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 40px;
}

h1 {
  margin-bottom: 5px;
}

.description {
  margin-bottom: 25px;
  max-width: 600px;
}

.container {
  display: flex;
  gap: 40px;
  margin-bottom: 20px;
}

.box {
  width: 400px;
  height: 300px;
  border: 1px solid #ccc;
}

.legend {
  margin-top: 10px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
}

.legend svg {
  margin-right: 10px;
}

.warning-links {
  position: fixed;
  right: 18px;
  bottom: 18px;
  display: flex;
  gap: 10px;
}

.warning-link {
  width: 38px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid #d1d5db;
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<h1>Buffer</h1>

<div class="description">
Buffer creates a polygon that represents a distance from a point,
line or the boundary of a polygon.
</div>

<div class="container">

  <!-- DIV 1: Original Points -->
  <div class="box">
    <svg width="400" height="300">
      <circle cx="100" cy="150" r="6" fill="blue"/>
      <circle cx="200" cy="100" r="6" fill="blue"/>
      <circle cx="300" cy="200" r="6" fill="blue"/>
    </svg>
  </div>

  <!-- DIV 2: Points + Buffer -->
  <div class="box">
    <svg width="400" height="300">

      <!-- Buffer polygons -->
      <circle cx="100" cy="150" r="40"
        fill="red" fill-opacity="0.2"
        stroke="red" stroke-width="2"/>

      <circle cx="200" cy="100" r="40"
        fill="red" fill-opacity="0.2"
        stroke="red" stroke-width="2"/>

      <circle cx="300" cy="200" r="40"
        fill="red" fill-opacity="0.2"
        stroke="red" stroke-width="2"/>

      <!-- Original Points -->
      <circle cx="100" cy="150" r="6" fill="blue"/>
      <circle cx="200" cy="100" r="6" fill="blue"/>
      <circle cx="300" cy="200" r="6" fill="blue"/>

    </svg>
  </div>

</div>

<div class="legend">

  <div class="legend-item">
    <svg width="20" height="20">
      <circle cx="10" cy="10" r="5" fill="blue"/>
    </svg>
    = original point data
  </div>

  <div class="legend-item">
    <svg width="20" height="20">
      <circle cx="10" cy="10" r="8"
        fill="red" fill-opacity="0.2"
        stroke="red" stroke-width="2"/>
    </svg>
    = new polygon layer
  </div>

</div>


<div class="warning-links">
  <a class="warning-link" href="images/warning-1.jpg" target="_blank" rel="noopener" title="Open warning image 1">⚠️</a>
  <a class="warning-link" href="images/warning-2.jpg" target="_blank" rel="noopener" title="Open warning image 2">⚠️</a>
</div>

</body>
</html>
